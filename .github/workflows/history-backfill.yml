name: ashare-history-v4
on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * 1-5"
permissions:
  contents: write
concurrency:
  group: ashare-history-v4
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODE: history
      HISTORY_YEARS_PER_RUN: 1
      MAX_WORKERS: 8
      BATCH_SIZE: 200
      RETRIES: 3
      START_YEAR: 2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V4 history backfill
        run: python sync_daily_v4.py
      - name: Commit and push
        run: |
          git config user.name "ashare-bot"
          git config user.email "ashare-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V4 history sync $(date -u +%Y-%m-%d)"; git push; fi
