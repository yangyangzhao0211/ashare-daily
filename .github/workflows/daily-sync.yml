name: ashare-daily-sync

on:
  schedule:
    # 每天 16:30 北京时间 (08:30 UTC)，仅交易日
    - cron: "30 8 * * 1-5"
  workflow_dispatch:  # 允许手动触发（首次全量回填用这个）

concurrency:
  group: ashare-daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync A-share daily bars
        run: python scripts/sync_daily.py

      - name: Commit and push
        run: |
          git config user.name "ashare-bot"
          git config user.email "ashare-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes, skip commit"
          else
            git commit -m "daily sync $(date -u +%Y-%m-%d)"
            git push
          fi
