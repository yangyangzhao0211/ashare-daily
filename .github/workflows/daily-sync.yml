name: ashare-daily-v4
on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ashare-daily-v4
  cancel-in-progress: false
jobs:
  recent:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODE: recent
      RECENT_DAYS: 130
      MAX_WORKERS: 8
      BATCH_SIZE: 200
      RETRIES: 3
      START_YEAR: 2019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V4 recent sync
        run: python sync_daily.py
      - name: Commit and push
        run: |
          git config user.name "ashare-bot"
          git config user.email "ashare-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "V4 recent sync $(date -u +%Y-%m-%d)"; git push; fi
