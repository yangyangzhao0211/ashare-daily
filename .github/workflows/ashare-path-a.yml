name: A-share V5 Path A

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "先选 probe 验收；通过后选 recent/history/repair"
        type: choice
        default: probe
        options: [probe, recent, history, repair]
      max_days:
        description: "本轮最多尝试的交易日数量（时间预算仍生效）"
        default: "100"
        type: string
  schedule:
    # Beijing 16:30: fetch already finalized days; today waits for evening pass.
    - cron: "30 8 * * 1-5"
    # Beijing 21:30: today's publication check and recent-day repairs.
    - cron: "30 13 * * 1-5"
    # Beijing 02:30 daily: newest-first historical backfill.
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: ashare-db-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      START_DATE: "2019-01-01"
      RECENT_TRADING_DAYS: "120"
      RUN_MINUTES: "30"
      REQUEST_TIMEOUT: "60"
      SOCKET_TIMEOUT: "20"
      REQUEST_PAUSE: "1"
      GIT_CHECKPOINT: "1"
      # Empty secret means public anonymous access. No paid-key requirement is assumed.
      BAOSTOCK_API_KEY: ${{ secrets.BAOSTOCK_API_KEY }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_MAX_DAYS: ${{ inputs.max_days }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure checkpoint author
        run: |
          git config user.name "ashare-v5-bot"
          git config user.email "ashare-v5-bot@users.noreply.github.com"
      - name: Probe or collect trading dates
        shell: bash
        run: |
          task_mode="${INPUT_MODE:-recent}"
          if [ "$EVENT_SCHEDULE" = "30 18 * * *" ]; then
            task_mode="history"
          fi
          python -u sync_daily.py --mode "$task_mode" --max-days "${INPUT_MAX_DAYS:-100}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/v5/
            data/v5/state.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload this run's recoverable data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .recovery_v5/last-run.zip
          if-no-files-found: ignore
          retention-days: 7
